app = "weft-rusterholz-org"
# Dallas: the region nearest the owner that Fly still provisions in.
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  # Plain http is redirected, so every request reaching the app arrived over
  # TLS, and Fly's proxy says so in X-Forwarded-Proto. The session cookie is
  # secure, and a request the app saw as plain http would get none.
  force_https = true

  # Always on. Visitor state lives in this one machine's memory, so stopping it
  # empties every example, and a cold start is not something to show anyone.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
