name: CI

# The same three checks bin/check runs, plus the image build, so a green run
# here and a green run locally mean the same thing. No deploy and no secrets:
# see docs/development.md, "Continuous Integration".

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Specs, lint, doc drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No ruby-version here on purpose: with none given, setup-ruby reads
      # .ruby-version, so the pin lives in one place.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # The same three bin/check runs, split so a failure names itself.
      - run: bundle exec rspec
      - run: bundle exec rubocop
      - run: bundle exec bin/doc-drift-check

  image:
    name: Image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Nothing is pushed anywhere: this only proves the Dockerfile still
      # produces an image, which is what a deploy will later depend on.
      - run: docker build -t weft-site .

  # The one check branch protection requires. Jobs can be added or renamed
  # above without touching the ruleset.
  final-results:
    name: Final Results
    runs-on: ubuntu-latest
    needs: [check, image]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.check.result }}" != "success" ] || \
             [ "${{ needs.image.result }}" != "success" ]; then
            echo "One or more jobs failed"
            echo "  check: ${{ needs.check.result }}"
            echo "  image: ${{ needs.image.result }}"
            exit 1
          fi
          echo "All checks passed"
